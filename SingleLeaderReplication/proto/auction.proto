syntax = "proto3";
package proto;
option go_package = "SingleLeaderReplication/proto";

service AuctionService {
  rpc Bid(BidRequest) returns (BidResponse);
  rpc Result(ResultRequest) returns (ResultResponse);
}

message BidRequest{
  int64 amount    = 1;
  int64 bidder_id = 2;
}

message BidResponse{
  string ack = 1;
}

message ResultRequest{
  message ResultResponse{
    int64 highest_bid    = 1;
    int64 highest_bidder = 2;
    bool  auction_ended  = 3;
  }
}

message ResultResponse{
  int64 highest_bid    = 1;
  int64 highest_bidder = 2;
  bool  auction_ended  = 3;
}

service ReplicationService{
  rpc Replicate(State) returns (Empty);
  rpc Ping(Empty) returns (Empty);
}

message State{
  int64          highest_bid    = 1;
  int64          highest_bidder = 2;
  repeated int64 bidder_ids     = 3;

}

message Empty{}