syntax = "proto3";
package proto;
option go_package = "SingleLeaderReplication/proto";

service AuctionService {
  rpc Bid(BidRequest) returns (BidResponse);
  rpc Result(ResultRequest) returns (ResultResponse);
}

message BidRequest{
  int64 amount    = 1;
  int64 bidder_id = 2;
}

message BidResponse{
  string ack = 1;
}

message ResultRequest{}
message ResultResponse{
    int64 highest_bid    = 1;
    int64 highest_bidder = 2;
    bool  auction_ended  = 3;
}
service ReplicationService{
  rpc Replicate(State) returns (Empty);  
  rpc Heartbeat(State) returns (Empty);  
  rpc Ping(Empty) returns (State); 
}

message State{
  int64          highest_bid    = 1;
  int64          highest_bidder = 2;
  repeated int64 bidder_ids     = 3;
  int64 seq  = 4;
  int64 end_time_unix_ms = 5;
  int64 leader_id = 6;

}

message ElectionRequest {int64 candidate_id = 1;}
message ElectionResponse   { bool ok = 1; }
message CoordinatorRequest { int64 leader_id = 1; }
message Empty{}